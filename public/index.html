<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>🎾 מגרשי טניס - גבעת חיים איחוד</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.7/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gutter-w: 52px;
      --day-hdr-h: 54px;
      --court-hdr-h: 22px;
      --slot-h: 20px;
      --green: #2e7d32;
      --green-dk: #1b5e20;
      --border: #e4e4e4;
      --border-hr: #d0d0d0;
    }

    html, body, #root { height: 100%; overflow: hidden; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      background: #eef1f0;
      color: #111;
    }

    #root {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 0 32px rgba(0,0,0,.13);
    }

    /* ─ Header ───────────────────────────────────── */
    .app-hdr {
      flex-shrink: 0;
      background: linear-gradient(135deg, var(--green-dk), var(--green));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      gap: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,.22);
      z-index: 20;
    }
    .app-title { font-size: 1.05rem; font-weight: 400; font-family: 'Rubik', sans-serif !important; }
    .app-subtitle { font-size: .68rem; font-weight: 400; opacity: .78; margin-top: 2px; font-family: Arial, sans-serif; }
    .user-chip {
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 20px;
      padding: 4px 13px;
      font-size: .81rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .user-chip:hover { background: rgba(255,255,255,.28); }

    /* ─ Week nav ──────────────────────────────────── */
    .week-nav {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: #f8f9f8;
      border-bottom: 1px solid var(--border);
      gap: 8px;
      z-index: 10;
    }
    .wn-btn {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 5px 11px;
      font-size: .82rem;
      cursor: pointer;
      color: #333;
      white-space: nowrap;
    }
    .wn-btn:hover { background: #f2f2f2; }
    .wn-center { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .wn-label  { font-size: .87rem; font-weight: 700; color: #1a1a1a; }
    .wn-sub    { font-size: .7rem;  color: #999; }
    .today-btn {
      background: none;
      border: 1px solid var(--green);
      color: var(--green);
      border-radius: 6px;
      padding: 2px 8px;
      font-size: .7rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* ─ Calendar shell ────────────────────────────── */
    .cal-shell {
      flex: 1;
      min-height: 0;
      overflow: auto;           /* single scroll container for both axes */
      -webkit-overflow-scrolling: touch;
      /* direction stays RTL (from html) so overflow expands leftward
         and the time gutter on the right is naturally "stuck" at start */
    }

    /* inner wrapper — width driven by content */
    .cal-inner {
      display: flex;
      flex-direction: column;
      min-width: max-content;   /* never compress columns */
    }

    /* ─ Sticky header rows ────────────────────────── */
    .hdr-row-1 {
      position: sticky;
      top: 0;
      z-index: 12;
      display: flex;
      background: #fff;
      border-bottom: 1px solid var(--border);
      height: var(--day-hdr-h);
    }
    .hdr-row-2 {
      position: sticky;
      top: var(--day-hdr-h);
      z-index: 11;
      display: flex;
      background: #f4f7f4;
      border-bottom: 2px solid var(--border-hr);
      height: var(--court-hdr-h);
    }

    /* Corner cells — sticky on BOTH axes */
    .corner {
      position: sticky;
      right: 0;
      flex-shrink: 0;
      width: var(--gutter-w);
      background: inherit;      /* inherit from parent row */
      z-index: 15;
      border-left: 1px solid var(--border);
    }

    /* Day header group (spans 2 court columns) */
    .day-hd {
      flex: 1;
      min-width: 72px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      border-left: 1px solid var(--border);
      padding: 4px 2px;
    }
    .day-hd .dn  { font-size: .71rem; color: #888; font-weight: 500; }
    .day-hd .dd  {
      font-size: .88rem; font-weight: 800;
      min-width: 36px; height: 26px; line-height: 26px;
      padding: 0 5px;
      text-align: center; border-radius: 13px;
    }
    .day-hd.today .dd { background: var(--green); color: #fff; }
    .day-hd.past .dn,
    .day-hd.past .dd  { color: #ccc; }

    /* Court sub-header cells */
    .court-sub-day {
      flex: 1;
      min-width: 72px;
      display: flex;
      border-left: 1px solid var(--border);
    }
    .court-sub-cell {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .64rem;
      font-weight: 700;
      color: #555;
      border-left: 1px solid var(--border);
      white-space: nowrap;
      overflow: hidden;
      padding: 0 2px;
    }
    .court-sub-cell:first-child { border-left: none; }
    .court-sub-cell.c1-accent { background: rgba(21,101,192,.08); color: #333; }
    .court-sub-cell.c2-accent { background: rgba(230,81,0,.08);   color: #333; }
    .cnum { color: var(--green); font-size: .75rem; margin-left: 2px; }

    /* ─ Body row (time gutter + day groups) ────────── */
    .body-row { display: flex; }

    /* Time gutter — sticky to the right */
    .time-gutter {
      position: sticky;
      right: 0;
      z-index: 10;
      flex-shrink: 0;
      width: var(--gutter-w);
      background: #fff;
      border-left: 1px solid var(--border);
    }
    .tlabel {
      height: var(--slot-h);
      font-size: .6rem;
      color: #999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 6px;
    }

    /* Day groups */
    .days-area { display: flex; flex: 1; }
    .day-group  {
      flex: 1;
      min-width: 72px;
      display: flex;
      border-left: 1px solid var(--border-hr);
    }

    /* Individual court column */
    .court-col {
      flex: 1;
      position: relative;
      border-left: 1px solid var(--border);
      touch-action: pan-x pan-y;
      cursor: crosshair;
      user-select: none;
    }
    .court-col:first-child { border-left: none; }
    .court-col.past-day    { background: rgba(0,0,0,.022); }

    .slot {
      height: var(--slot-h);
      border-bottom: 1px solid transparent;
    }
    .slot.hr  { border-bottom-color: var(--border); }
    .slot.hh  { border-bottom-color: #f0f0f0; }
    .slot.pst { background: rgba(0,0,0,.03); cursor: default; }
    .slot:not(.pst):hover { background: #e8f5e9; }

    /* Booking block */
    .bk {
      position: absolute;
      left: 1px; right: 1px;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: .63rem;
      font-weight: 700;
      line-height: 1.3;
      overflow: hidden;
      cursor: pointer;
      z-index: 8;
      box-shadow: 0 1px 3px rgba(0,0,0,.18);
      color: #fff;
    }
    /* Court 1 (מערבי) — blue */
    .bk.c1 { background: #1565c0; }
    /* Court 2 (מזרחי) — deep orange */
    .bk.c2 { background: #e65100; }
    /* My bookings — green (overrides court color) */
    .bk.mine { background: #2e7d32; border-right: 3px solid rgba(255,255,255,0.65); }
    /* Tennis lesson bookings — diagonal stripes per court color */
    .bk.lesson {
      color: #fff;
      text-shadow: 0 1px 2px rgba(0,0,0,.4);
    }
    .bk.c1.lesson {
      background: repeating-linear-gradient(
        -45deg,
        #5b9bd5 0px, #5b9bd5 5px,
        #a8cff0 5px, #a8cff0 12px
      ) !important;
      border: 1px solid #4a86c0;
    }
    .bk.c2.lesson {
      background: repeating-linear-gradient(
        -45deg,
        #e07b3a 0px, #e07b3a 5px,
        #f5c09a 5px, #f5c09a 12px
      ) !important;
      border: 1px solid #c9682a;
    }
    .bk.past    { opacity: .38; }

    .bk .bt     { font-weight: 400; font-size: .57rem; opacity: .88; }
    /* Court column subtle tint */
    .court-col.tint-c2 { background: rgba(230,81,0,0.03); }

    /* Drag selection */
    .sel {
      position: absolute;
      left: 1px; right: 1px;
      background: rgba(76,175,80,.25);
      border: 2px solid #4caf50;
      border-radius: 4px;
      pointer-events: none;
      z-index: 5;
    }

    /* ─ Legend ────────────────────────────────────── */
    .legend {
      flex-shrink: 0;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      padding: 4px 12px;
      font-size: .7rem;
      color: #777;
      border-top: 1px solid var(--border);
      background: #fafafa;
    }
    .ldot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 3px;
      margin-left: 4px;
      vertical-align: middle;
    }

    /* ─ Modals ────────────────────────────────────── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.48);
      display: flex; align-items: flex-start; justify-content: center;
      z-index: 1000;
      padding: 20px 16px 40px;
      overflow-y: auto;
      backdrop-filter: blur(3px);
    }
    /* center vertically only when there's enough room */
    @media (min-height: 500px) {
      .overlay { align-items: center; }
    }
    .modal {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      width: 100%; max-width: 360px;
      box-shadow: 0 24px 64px rgba(0,0,0,.28);
      animation: pop .16s ease;
      flex-shrink: 0;
    }
    @keyframes pop { from { transform: scale(.93); opacity: 0; } }
    .modal h2 { font-size: 1.1rem; margin-bottom: 14px; }
    .info-box {
      background: #f5f5f5; border-radius: 10px;
      padding: 12px 14px; margin-bottom: 16px;
      font-size: .87rem; line-height: 1.75; color: #333;
    }
    .txt-in {
      width: 100%; padding: 10px 12px;
      border: 2px solid #ddd; border-radius: 8px;
      font-size: 1rem; text-align: right;
      font-family: inherit; direction: rtl;
      margin-bottom: 14px; transition: border-color .2s;
    }
    .txt-in:focus { outline: none; border-color: var(--green); }
    .m-row  { display: flex; gap: 8px; flex-direction: row-reverse; }
    .btn    {
      flex: 1; padding: 10px; border: none; border-radius: 8px;
      font-size: .91rem; font-weight: 700; cursor: pointer;
      font-family: inherit; transition: filter .15s;
    }
    .btn:hover    { filter: brightness(.91); }
    .btn:disabled { opacity: .48; cursor: default; filter: none; }
    .btn-ok  { background: var(--green); color: #fff; }
    .btn-sec { background: #eee; color: #444; }
    .btn-del { background: #c62828; color: #fff; }

    .role-row { display: flex; gap: 10px; margin-bottom: 18px; }
    .role-btn {
      flex: 1; padding: 14px 8px; border-radius: 12px;
      border: 2px solid #e0e0e0; background: #fafafa;
      cursor: pointer; text-align: center; transition: all .15s;
    }
    .role-btn:hover { border-color: var(--green); background: #f0f7f0; }
    .role-btn.active { border-color: var(--green); background: #e8f5e9; }
    .role-btn .role-icon { font-size: 1.6rem; display: block; margin-bottom: 4px; }
    .role-btn .role-lbl { font-size: .82rem; font-weight: 700; color: #333; }
    .admin-err { color: #c62828; font-size: .82rem; margin-top: -8px; margin-bottom: 8px; }

    .time-sel {
      width: 100%; padding: 10px 12px; border: 1px solid #ddd;
      border-radius: 10px; font-size: .95rem; margin-bottom: 12px;
      background: #fafafa; appearance: none; direction: rtl;
    }
    .time-sel:focus { outline: none; border-color: var(--green); }
    .tp-label { font-size: .78rem; color: #666; margin-bottom: 4px; font-weight: 600; }
    .err { color: #c62828; font-size: .81rem; margin-bottom: 10px; }

    @media (max-width: 520px) {
      :root { --slot-h: 18px; --gutter-w: 40px; --day-hdr-h: 50px; --court-hdr-h: 20px; }
      .tlabel   { font-size: .55rem; }
      .day-hd   { min-width: 58px; }
      .day-hd .dd { font-size: .78rem; min-width: 32px; height: 22px; line-height: 22px; border-radius: 11px; }
      .day-group, .court-sub-day { min-width: 58px; }
      .court-sub-cell { font-size: .58rem; }
      .bk { font-size: .57rem; }
    }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ── Constants ───────────────────────────────────── */
// מספרי טלפון של אדמינים — רשאים למחוק כל הזמנה
const ADMINS = [
  '0506391216',
  '0507700623',
];

const COURTS  = [
  { id: 'west', n: 1, sub: 'מערבי' },
  { id: 'east', n: 2, sub: 'מזרחי' },
];
const DAYS_HE = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const SH       = 7;          // start hour
const EH       = 24;         // end hour (midnight)
const NS       = (EH-SH)*4;  // 68 slots

/* ── Helpers ─────────────────────────────────────── */
const s2t = s => {
  const m = (SH*60 + s*15) % (24*60);
  return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
};
const ds = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

const weekSun = d => {
  const x = new Date(d); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - x.getDay());
  return x;
};
const addD = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };


const isPast = (date, slot) => {
  const [y,m,day] = date.split('-').map(Number);
  const t = new Date(y,m-1,day);
  t.setMinutes(SH*60 + slot*15);
  return t < new Date();
};

const fmtRange = (a,b) => {
  const o = {day:'numeric',month:'long'};
  return `${a.toLocaleDateString('he-IL',o)} – ${b.toLocaleDateString('he-IL',o)}`;
};

const durLbl = n => {
  const m = n*15;
  return m<60 ? `${m} דקות` : m===60 ? 'שעה' : m===90 ? 'שעה וחצי' : m===120 ? 'שעתיים' : `${m} דקות`;
};

/* ── API ─────────────────────────────────────────── */
const api = {
  list: (f,t) => fetch(`/api/bookings?from=${f}&to=${t}`).then(r=>r.json()),
  create: b  => fetch('/api/bookings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})
                 .then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error);return j;}),
  del: (id,phone) => fetch(`/api/bookings/${id}`,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})})
                 .then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error);return j;}),
  upd: (id,b) => fetch(`/api/bookings/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})
                 .then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error);return j;}),
  recurList:   ()        => fetch('/api/recurring').then(r=>r.json()),
  recurCreate: (rule)    => fetch('/api/recurring',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rule)})
                 .then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error);return j;}),
  recurDel:    (id,phone)=> fetch(`/api/recurring/${id}`,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})})
                 .then(async r=>{const j=await r.json();if(!r.ok)throw new Error(j.error);return j;}),
};

/* ── Modals ──────────────────────────────────────── */
function NameModal({initial, onSave}) {
  const [mode,  setMode]  = useState(null); // null | 'player' | 'admin'
  const [name,  setName]  = useState(initial?.name  || '');
  const [phone, setPhone] = useState(initial?.phone || '');
  const [err,   setErr]   = useState('');

  const handleSave = () => {
    if (mode === 'admin') {
      if (!ADMINS.includes(phone.trim())) { setErr('מספר הטלפון אינו מורשה כמנהל'); return; }
      onSave(name.trim() || 'מנהל', phone.trim());
    } else {
      onSave(name.trim(), phone.trim());
    }
  };

  const validPlayer = name.trim() && phone.trim();
  const validAdmin  = phone.trim();

  return (
    <div className="overlay">
      <div className="modal">
        <h2>🎾 ברוכים הבאים!</h2>

        {!mode && <>
          <p style={{marginBottom:14,color:'#555',fontSize:'.87rem'}}>כיצד תרצה להיכנס?</p>
          <div className="role-row">
            <button className="role-btn" onClick={()=>setMode('player')}>
              <span className="role-icon">🏃</span>
              <span className="role-lbl">שחקן</span>
            </button>
            <button className="role-btn" onClick={()=>setMode('admin')}>
              <span className="role-icon">🛡️</span>
              <span className="role-lbl">מנהל</span>
            </button>
          </div>
        </>}

        {mode === 'player' && <>
          <p style={{marginBottom:14,color:'#555',fontSize:'.87rem'}}>פרטים אלה ישמרו בדפדפן שלך.</p>
          <input className="txt-in" placeholder="שם מלא" value={name}
            onChange={e=>setName(e.target.value)} />
          <input className="txt-in" placeholder="מספר טלפון" value={phone}
            onChange={e=>setPhone(e.target.value)}
            type="tel" inputMode="numeric" />
          <div className="m-row">
            <button className="btn btn-ok" disabled={!validPlayer} onClick={handleSave}>המשך</button>
            <button className="btn btn-sec" onClick={()=>setMode(null)}>חזרה</button>
          </div>
        </>}

        {mode === 'admin' && <>
          <p style={{marginBottom:14,color:'#555',fontSize:'.87rem'}}>הזן את מספר הטלפון המורשה.</p>
          <input className="txt-in" placeholder="שם (אופציונלי)" value={name}
            onChange={e=>setName(e.target.value)} />
          <input className="txt-in" placeholder="מספר טלפון" value={phone}
            onChange={e=>{setPhone(e.target.value);setErr('');}}
            type="tel" inputMode="numeric" />
          {err && <div className="admin-err">⚠️ {err}</div>}
          <div className="m-row">
            <button className="btn btn-ok" disabled={!validAdmin} onClick={handleSave}>כניסה כמנהל</button>
            <button className="btn btn-sec" onClick={()=>setMode(null)}>חזרה</button>
          </div>
        </>}
      </div>
    </div>
  );
}

function TimePickerModal({date, court, slot, endSlot, isAdmin, isLesson, onSelect, onCancel}) {
  const c = COURTS.find(x=>x.id===court);
  const [y,m,d] = date.split('-').map(Number);
  const label = new Date(y,m-1,d).toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'});

  const [start, setStart] = useState(slot);
  const [end,   setEnd]   = useState(Math.min(endSlot ?? slot + 4, NS));

  const startOpts = Array.from({length: NS}, (_,i) => i).filter(i => !isPast(date, i));
  const maxSlots  = (isAdmin || isLesson) ? NS : 8;
  const endOpts   = Array.from({length: maxSlots}, (_,i) => start + i + 1).filter(i => i <= NS);

  const valid = end > start;
  return (
    <div className="overlay" onClick={onCancel}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <h2>בחר שעות</h2>
        <div className="info-box" style={{marginBottom:16}}>
          <div>📅 {label}</div>
          <div>🎾 מגרש {c.n}</div>
        </div>
        <div className="tp-label">שעת התחלה</div>
        <select className="time-sel" value={start}
          onChange={e=>{ const v=+e.target.value; setStart(v); if(end<=v) setEnd(Math.min(v+4,lessonLimit)); }}>
          {startOpts.map(i=><option key={i} value={i}>{s2t(i)}</option>)}
        </select>
        <div className="tp-label">שעת סיום</div>
        <select className="time-sel" value={end}
          onChange={e=>setEnd(+e.target.value)}>
          {endOpts.map(i=><option key={i} value={i}>{s2t(i)}</option>)}
        </select>
        <div className="m-row">
          <button className="btn btn-ok" disabled={!valid}
            onClick={()=>onSelect({date,court,startSlot:start,endSlot:end})}>המשך</button>
          <button className="btn btn-sec" onClick={onCancel}>ביטול</button>
        </div>
      </div>
    </div>
  );
}

        {err && <div className="err">⚠️ {err}</div>}
        <div className="m-row">

/* ── Court column ────────────────────────────────── */
function CourtCol({courtId, date, bks, sel, user, phone, slotH, pastDay, tint, onDown, onSlotClick, onBkClick}) {
  return (
    <div
      className={`court-col${pastDay?' past-day':''}${tint?' tint-c2':''}`}
      onPointerDown={e=>onDown(e,date,courtId)}
      onClick={e=>onSlotClick(e,date,courtId)}
    >
      {/* Slot rows */}
      {Array.from({length:NS},(_,i)=>{
        const past = isPast(date,i);
        let cls='slot';
        if((i+1)%4===0) cls+=' hr'; else if((i+1)%2===0) cls+=' hh';
        if(past) cls+=' pst';
        return <div key={i} className={cls} />;
      })}

      {/* Selection overlay */}
      {sel&&sel.date===date&&sel.court===courtId&&(
        <div className="sel" style={{top:sel.startSlot*slotH, height:(sel.endSlot-sel.startSlot)*slotH}} />
      )}

      {/* Bookings */}
      {bks.map(b=>{
        const mine = b.phone===phone && !b.is_lesson;
        const past = isPast(b.date, b.start_slot);
        const cc   = b.court==='west' ? 'c1' : 'c2';
        return (
          <div key={b.id}
            className={`bk ${cc} ${b.is_lesson?'lesson':''} ${mine?'mine':''} ${past?'past':''}`}
            style={{top:b.start_slot*slotH+1, height:(b.end_slot-b.start_slot)*slotH-2}}
            onPointerDown={e=>e.stopPropagation()}
            onClick={e=>{e.stopPropagation();onBkClick(b);}}>
            <div>{b.user_name}</div>
            <div className="bt">{s2t(b.start_slot)}–{s2t(b.end_slot)}</div>
            {b.note && <div className="bt" style={{opacity:.75,marginTop:1}}>{b.note}</div>}
          </div>
        );
      })}
    </div>
  );
}

/* ── App ─────────────────────────────────────────── */
function App() {
  const today = useRef(new Date()).current;
  const [wkOff,  setWkOff]  = useState(0);
  const [bks,    setBks]    = useState([]);
  const [user,      setUser]      = useState(localStorage.getItem('tennisUser')||'');
  const [phone,     setPhone]     = useState(localStorage.getItem('tennisPhone')||'');
  const [showNm,    setShowNm]    = useState(!localStorage.getItem('tennisUser')||!localStorage.getItem('tennisPhone'));
  const [adminMode, setAdminMode] = useState(localStorage.getItem('tennisAdminMode')==='true' && ADMINS.includes(localStorage.getItem('tennisPhone')||''));
  const [showMode,  setShowMode]  = useState(false);
  const [drag,     setDrag]     = useState(null);
  const [pend,     setPend]     = useState(null);
  const [timePick, setTimePick] = useState(null);
  const [cfmErr,   setCfmErr]   = useState('');
  const [selBk,    setSelBk]    = useState(null);
  const [editBk,   setEditBk]   = useState(null);
  const [bookName,    setBookName]    = useState(user);
  const [bookPhone,   setBookPhone]   = useState(phone);
  const [bookNote,    setBookNote]    = useState('');
  const [isLessonBk,  setIsLessonBk]  = useState(false);
  const [typeSelect,  setTypeSelect]  = useState(null); // {date,court,slot,endSlot}
  const [showRecur,   setShowRecur]   = useState(false);
  const [recurRules,  setRecurRules]  = useState([]);
  const [recurErr,    setRecurErr]    = useState('');
  const [isRecurring, setIsRecurring] = useState(false);
  const [recurDays,   setRecurDays]   = useState([]);
  const [recurToDate, setRecurToDate] = useState('');

  const ws   = weekSun(addD(today, wkOff*7));
  const days = Array.from({length:7},(_,i)=>addD(ws,i));
  const we   = days[6];

  const slotH = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--slot-h'))||20;

  /* Load */
  const load = useCallback(async()=>{
    try { setBks(await api.list(ds(ws),ds(we))); } catch(e){console.error(e);}
  },[wkOff]);

  useEffect(()=>{load();},[load]);
  useEffect(()=>{const t=setInterval(load,30000);return()=>clearInterval(t);},[load]);

  // גלילה אוטומטית ל-15:00 בטעינה
  useEffect(()=>{
    const shell = shellRef.current;
    if (!shell) return;
    const slot15 = (15 - SH) * 4; // slot 32
    shell.scrollTop = slot15 * slotH;
  }, []);

  /* Compute slot index from absolute clientY — no dependency on currentTarget */
  const slotFromY = useCallback(clientY => {
    const shell = document.querySelector('.cal-shell');
    if (!shell) return 0;
    const shR    = shell.getBoundingClientRect();
    const sticky = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--day-hdr-h'))
                 + parseInt(getComputedStyle(document.documentElement).getPropertyValue('--court-hdr-h'));
    const y = clientY - shR.top - sticky + shell.scrollTop;
    return Math.max(0, Math.min(NS-1, Math.floor(y / slotH)));
  }, [slotH]);

  const mkSel = (date, court, a, b) => {
    const s = Math.min(a, b);
    return { date, court, startSlot: s, endSlot: Math.min(s+8, Math.max(a,b)+1) };
  };

  /* dragRef keeps drag state accessible inside event listeners */
  const dragRef     = useRef(null);
  const shellRef    = useRef(null);
  const wasDragRef  = useRef(false);

  /* Attach drag listeners to the cal-shell element (more reliable on iOS than window) */
  useEffect(() => {
    const shell = shellRef.current;
    if (!shell) return;

    const onMove = e => {
      if (!dragRef.current) return;
      if (e.pointerType !== 'touch') e.preventDefault();
      const slot = slotFromY(e.clientY);
      if (Math.abs(e.clientY - dragRef.current.startY) > 12) dragRef.current.hasMoved = true;
      setDrag(prev => prev ? { ...prev, cur: slot } : null);
    };

    const onUp = e => {
      const d = dragRef.current;
      if (!d) return;
      const slot = slotFromY(e.clientY);
      dragRef.current = null;
      setDrag(null);
      if (d.hasMoved) {
        wasDragRef.current = true;
        const sel = mkSel(d.date, d.court, d.start, slot);
        if (sel.endSlot - sel.startSlot >= 1) {
          const tp = {date:sel.date,court:sel.court,slot:sel.startSlot,endSlot:sel.endSlot};
          setCfmErr('');
          if (isAdmin) { setTypeSelect(tp); } else { setIsLessonBk(false); setTimePick(tp); }
        }
      } else {
        wasDragRef.current = false;
      }
    };

    const onCancel = () => {
      dragRef.current = null;
      setDrag(null);
    };

    shell.addEventListener('pointermove',  onMove,  { passive: false });
    shell.addEventListener('pointerup',    onUp);
    shell.addEventListener('pointercancel',onCancel);
    return () => {
      shell.removeEventListener('pointermove',  onMove);
      shell.removeEventListener('pointerup',    onUp);
      shell.removeEventListener('pointercancel',onCancel);
    };
  }, [slotFromY]);

  const isAdmin = adminMode && ADMINS.includes(phone);
  const canAdmin = ADMINS.includes(phone);

  const toggleAdminMode = val => {
    setAdminMode(val);
    localStorage.setItem('tennisAdminMode', val ? 'true' : 'false');
    setShowMode(false);
  };

  const onDown = (e, date, court) => {
    if (e.pointerType === 'touch') return; // גלילה טבעית במגע אצבע
    if (pend !== null || selBk !== null || showNm || timePick !== null) return; // מודל פתוח
    const slot = slotFromY(e.clientY);
    if (isPast(date, slot)) return;
    const d = { date, court, start: slot, cur: slot, hasMoved: false, startY: e.clientY };
    dragRef.current = d;
    setDrag(d);
  };

  const onSlotClick = (e, date, court) => {
    if (wasDragRef.current) { wasDragRef.current = false; return; }
    if (pend !== null || selBk !== null || showNm || timePick !== null) return;
    const slot = slotFromY(e.clientY);
    if (isPast(date, slot)) return;
    const tp = { date, court, slot };
    if (isAdmin) { setCfmErr(''); setTypeSelect(tp); } else { setIsLessonBk(false); setTimePick(tp); }
  };

  const curSel = drag ? mkSel(drag.date, drag.court, drag.start, drag.cur) : null;

  const confirm = async()=>{
    setCfmErr('');
    try{
      if (editBk) {
        await api.upd(editBk.id, {startSlot:pend.startSlot, endSlot:pend.endSlot, phone});
        setEditBk(null);
      } else if (isAdmin && isRecurring) {
        await api.recurCreate({
          name: bookName.trim() || user,
          courts: [pend.court],
          days: recurDays,
          startSlot: pend.startSlot,
          endSlot: pend.endSlot,
          fromDate: pend.date,
          toDate: recurToDate || null,
          phone,
        });
      } else {
        await api.create({court:pend.court,date:pend.date,startSlot:pend.startSlot,endSlot:pend.endSlot,userName:bookName.trim()||user,phone:isAdmin?(bookPhone||phone):phone,...(isLessonBk?{isLesson:true}:{}),...(isAdmin&&bookNote.trim()?{note:bookNote.trim()}:{})});
      }
      setPend(null); load();
    }catch(e){setCfmErr(e.message);}
  };

  const saveDetails = async(id, userName, bookPhone, note) => {
    try { await api.upd(id, {userName, bookPhone, note, phone}); setSelBk(prev => prev ? {...prev, user_name: userName, phone: bookPhone, note} : null); load(); } catch(e) { alert(e.message); }
  };

  const loadRecur = async () => {
    try { setRecurRules(await api.recurList()); } catch(e){ console.error(e); }
  };

  const delRecur = async (id) => {
    try { await api.recurDel(id, phone); await loadRecur(); load(); }
    catch(e){ alert(e.message); }
  };

  const delBk = async()=>{
    const id = selBk.id;
    setSelBk(null);
    setBks(prev => prev.filter(b => b.id !== id)); // עדכון מיידי
    try { await api.del(id, phone); }
    catch(e) { alert(e.message); load(); } // טען מחדש אם נכשל
  };

  const todayStr = ds(today);

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100%',overflow:'hidden'}}>

      {/* App header */}
      <div className="app-hdr">
        <div>
          <div className="app-title">🎾 מגרשי טניס - גבעת חיים איחוד</div>
          <div className="app-subtitle">מפתח למגרש ולאור נמצא בת"ד 277 · נא להחזיר בסוף השימוש</div>
        </div>
        <div className="user-chip" onClick={()=>canAdmin ? setShowMode(true) : setShowNm(true)}>
          👤 {user||'הגדר שם'}{adminMode ? ' (מצב מנהל)' : ''}
        </div>
      </div>

      {/* Week navigation */}
      <div className="week-nav">
        <button className="wn-btn" onClick={()=>setWkOff(o=>o-1)}>▶ שבוע קודם</button>
        <div className="wn-center">
          <span className="wn-label">{fmtRange(ws,we)}</span>
          {wkOff===0
            ? <span className="wn-sub">שבוע נוכחי</span>
            : <button className="today-btn" onClick={()=>setWkOff(0)}>היום</button>}
        </div>
        <button className="wn-btn" onClick={()=>setWkOff(o=>o+1)}>שבוע הבא ◀</button>
      </div>

      {/* ── Single scrollable calendar shell ── */}
      <div className="cal-shell" ref={shellRef}>
        <div className="cal-inner">

          {/* ── Row 1: day names (sticky top=0) ── */}
          <div className="hdr-row-1">
            {/* corner */}
            <div className="corner" />
            {/* day cells — each spans 2 court columns */}
            {days.map((d,i)=>{
              const s=ds(d);
              const isToday=s===todayStr;
              const past=d<today&&!isToday;
              return (
                <div key={i} className={`day-hd${isToday?' today':''}${past?' past':''}`}>
                  <span className="dn">{DAYS_HE[d.getDay()]}</span>
                  <span className="dd">{d.getDate()}.{d.getMonth()+1}</span>
                </div>
              );
            })}
          </div>

          {/* ── Row 2: court sub-headers (sticky top=var(--day-hdr-h)) ── */}
          <div className="hdr-row-2">
            {/* corner */}
            <div className="corner" style={{borderLeft:'1px solid #e4e4e4'}} />
            {days.map((_,i)=>(
              <div key={i} className="court-sub-day">
                {COURTS.map(c=>{
                  const acc = c.id==='west' ? 'c1-accent' : 'c2-accent';
                  return (
                    <div key={c.id} className={`court-sub-cell ${acc}`}>
                      <span>מגרש&nbsp;{c.n}</span>
                    </div>
                  );
                })}
              </div>
            ))}
          </div>

          {/* ── Body: time gutter + day groups ── */}
          <div className="body-row">

            {/* Time gutter (sticky right=0) */}
            <div className="time-gutter">
              {Array.from({length:NS},(_,i)=>(
                <div key={i} className="tlabel" style={{height:slotH}}>
                  {i%4===0 ? s2t(i) : ''}
                </div>
              ))}
            </div>

            {/* Day groups */}
            <div className="days-area">
              {days.map((d,i)=>{
                const date=ds(d);
                const pastDay=d<today&&date!==todayStr;
                return (
                  <div key={i} className="day-group">
                    {COURTS.map(c=>(
                      <CourtCol
                        key={c.id}
                        courtId={c.id}
                        date={date}
                        bks={bks.filter(b=>b.date===date&&b.court===c.id)}
                        sel={curSel}
                        user={user}
                        phone={phone}
                        slotH={slotH}
                        pastDay={pastDay}
                        tint={c.id==='east'}
                        onDown={onDown}
                        onSlotClick={onSlotClick}
                        onBkClick={setSelBk}
                      />
                    ))}
                  </div>
                );
              })}
            </div>

          </div>{/* body-row */}
        </div>{/* cal-inner */}
      </div>{/* cal-shell */}

      {/* Legend */}
      <div className="legend">
        <span><span className="ldot" style={{background:'#2e7d32'}} />ההזמנות שלי</span>
        <span><span className="ldot" style={{background:'#1565c0'}} />מגרש 1</span>
        <span><span className="ldot" style={{background:'#e65100'}} />מגרש 2</span>
        <span><span className="ldot" style={{background:'repeating-linear-gradient(-45deg,#5b9bd5 0px,#5b9bd5 5px,#a8cff0 5px,#a8cff0 12px)'}} />שיעורי טניס מגרש 1</span>
        <span><span className="ldot" style={{background:'repeating-linear-gradient(-45deg,#e07b3a 0px,#e07b3a 5px,#f5c09a 5px,#f5c09a 12px)'}} />שיעורי טניס מגרש 2</span>
        <span><span className="ldot" style={{background:'#ccc'}} />שעות שעברו</span>
        <span style={{marginRight:'auto',color:'#ccc'}}>גרור או לחץ לבחירת שעות · לחץ על הזמנה לפרטים</span>
      </div>

      {showMode && (
        <div className="overlay" onClick={()=>setShowMode(false)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h2>👤 {user}</h2>
            <p style={{marginBottom:18,color:'#555',fontSize:'.87rem'}}>
              {adminMode ? 'כרגע במצב מנהל — יש לך גישה לאפשרויות עריכה מורחבות.' : 'כרגע במצב שחקן.'}
            </p>
            <div className="m-row" style={{flexDirection:'column',gap:10}}>
              {adminMode
                ? <button className="btn btn-sec" onClick={()=>toggleAdminMode(false)}>🏃 עבור למצב שחקן</button>
                : <button className="btn btn-ok"  onClick={()=>toggleAdminMode(true)}>🛡️ עבור למצב מנהל</button>}
              {adminMode && <button className="btn btn-sec" onClick={()=>{setShowMode(false);loadRecur();setShowRecur(true);}}>🔁 הזמנות קבועות</button>}
              <button className="btn btn-sec" onClick={()=>{setShowMode(false);setShowNm(true);}}>✏️ עריכת פרטים</button>
            </div>
          </div>
        </div>
      )}
      {showNm && <NameModal initial={{name:user,phone}} onSave={(n,p)=>{localStorage.setItem('tennisUser',n);localStorage.setItem('tennisPhone',p);setUser(n);setPhone(p);setShowNm(false);if(!ADMINS.includes(p)){setAdminMode(false);localStorage.setItem('tennisAdminMode','false');}}} />}
      {typeSelect && (
        <div className="overlay" onClick={()=>setTypeSelect(null)}>
          <div className="modal" onClick={e=>e.stopPropagation()}>
            <h2>סוג הזמנה</h2>
            <div className="m-row" style={{flexDirection:'column',gap:10}}>
              <button className="btn btn-ok" style={{width:'100%'}} onClick={()=>{setIsLessonBk(false);setTimePick(typeSelect);setTypeSelect(null);}}>📅 הזמנה רגילה</button>
              <button className="btn" style={{width:'100%',background:'#5b9bd5',color:'#fff'}} onClick={()=>{setIsLessonBk(true);setBookName('שיעורי טניס');setTimePick(typeSelect);setTypeSelect(null);}}>🎾 שיעורי טניס</button>
              <button className="btn btn-sec" style={{width:'100%'}} onClick={()=>setTypeSelect(null)}>ביטול</button>
            </div>
          </div>
        </div>
      )}
      {timePick && <TimePickerModal {...timePick} isAdmin={isAdmin} isLesson={isLessonBk} onCancel={()=>{setTimePick(null);setEditBk(null);}}
        onSelect={sel=>{
          setTimePick(null);setPend(sel);setCfmErr('');
          if(!isLessonBk){setBookName(user);setBookPhone(phone);}
          setBookNote('');
          const [y,m,d] = sel.date.split('-').map(Number);
          setIsRecurring(false);setRecurDays([new Date(y,m-1,d).getDay()]);setRecurToDate('');
        }} />}
      {pend   && <ConfirmModal sel={pend} user={user} phone={phone} isAdmin={isAdmin} bookName={bookName} setBookName={setBookName} bookPhone={bookPhone} setBookPhone={setBookPhone} bookNote={bookNote} setBookNote={setBookNote} isLesson={isLessonBk} setIsLesson={setIsLessonBk}
        isRecurring={isRecurring} setIsRecurring={setIsRecurring} recurDays={recurDays} setRecurDays={setRecurDays} recurToDate={recurToDate} setRecurToDate={setRecurToDate}
        onOk={confirm} onCancel={()=>setPend(null)} err={cfmErr} />}
      {selBk  && <DetailModal bk={selBk} isOwner={selBk.phone===phone||isAdmin} isAdmin={isAdmin} onDel={delBk}
        onEdit={()=>{ setEditBk(selBk); setTimePick({date:selBk.date,court:selBk.court,slot:selBk.start_slot,endSlot:selBk.end_slot}); setSelBk(null); }}
        onSave={(name,ph,note)=>saveDetails(selBk.id,name,ph,note)}
        onClose={()=>setSelBk(null)} />}
      {showRecur && <RecurringManageModal rules={recurRules} onDelete={delRecur} onClose={()=>setShowRecur(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
